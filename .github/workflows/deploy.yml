  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.build-push.outputs.image }}:latest
      BASE_DOMAIN: owlhacks-deploy-now.xyz
    steps:
      - name: Compute STUDENT_HOST
        id: shost
        shell: bash
        run: |
          HOST="${{ secrets.STUDENT_HOST }}"
          if [ -z "$HOST" ]; then
            REPO="${{ github.repository }}"
            NAME="${REPO#*/}"
            NAME_LC="$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-')"
            HOST="${NAME_LC}.${BASE_DOMAIN}"
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Using STUDENT_HOST=$HOST"

      - name: Deploy to workshop VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # 👇 Forward these envs into the remote shell
          envs: STUDENT_HOST,IMAGE
          script: |
            set -euo pipefail

            echo "Deploying to ${STUDENT_HOST}"

            docker network inspect caddy >/dev/null 2>&1 || docker network create caddy

            APPDIR="$HOME/apps/${STUDENT_HOST}"
            mkdir -p "$APPDIR"

            cat > "$APPDIR/compose.yml" <<'YML'
            version: "3.8"
            networks:
              caddy:
                external: true
            services:
              app:
                image: __IMAGE__
                restart: unless-stopped
                expose:
                  - "8080"
                networks: [ caddy ]
                labels:
                  caddy: __HOST__
                  caddy.reverse_proxy: "{{upstreams 8080}}"
            YML

            sed -i "s|__IMAGE__|${IMAGE}|g" "$APPDIR/compose.yml"
            sed -i "s|__HOST__|${STUDENT_HOST}|g" "$APPDIR/compose.yml"

            cd "$APPDIR"
            docker compose pull
            docker compose up -d
            docker image prune -f
