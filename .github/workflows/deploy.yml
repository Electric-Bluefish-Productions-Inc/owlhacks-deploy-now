name: Build & Deploy (Laravel → Caddy docker-proxy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha_image: ${{ steps.vars.outputs.sha_image }}
    steps:
      - uses: actions/checkout@v4

      # Ensure Buildx (for cache)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # ✅ Compute lowercase image name for GHCR
      - name: Compute image name (lowercase)
        id: vars
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_image=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (cached)
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.sha_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    env:
      STUDENT_HOST: ${{ secrets.STUDENT_HOST }}
      IMAGE: ${{ needs.build-push.outputs.image }}:latest
    steps:
      - name: Deploy to workshop VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail

            docker network inspect caddy >/dev/null 2>&1 || docker network create caddy

            APPDIR="$HOME/apps/${STUDENT_HOST}"
            mkdir -p "$APPDIR"

            cat > "$APPDIR/compose.yml" <<'YML'
            version: "3.8"
            networks:
              caddy:
                external: true
            services:
              app:
                image: __IMAGE__
                restart: unless-stopped
                expose:
                  - "8080"
                networks: [ caddy ]
                labels:
                  caddy: __HOST__
                  caddy.reverse_proxy: "{{upstreams 8080}}"
            YML

            sed -i "s|__IMAGE__|${IMAGE}|g" "$APPDIR/compose.yml"
            sed -i "s|__HOST__|${STUDENT_HOST}|g" "$APPDIR/compose.yml"

            cd "$APPDIR"
            docker compose pull
            docker compose up -d
            docker image prune -f
